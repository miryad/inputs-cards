name: Update public market data

on:
  schedule:
    - cron: "17 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch, validate, and normalize market data
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: node scripts/update-data.mjs
      - name: Commit validated changes
        run: |
          git config user.name "inputs-cards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/data/commodities.json
          git diff --cached --quiet || git commit -m "data: refresh public market snapshot"
          git push
